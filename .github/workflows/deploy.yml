name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: mchs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mchs]
    timeout-minutes: 20
    steps:
      - name: Pull latest main (commit qilinmagan ishni stash'ga olib)
        run: |
          set -euo pipefail
          cd /opt/MCHS
          git fetch origin main

          # /opt/MCHS bir vaqtda deploy katalogi ham, server'da qo'lda
          # tahrirlanadigan ish katalogi ham (prod compose ./web va ./backend
          # papkalarini mount qiladi). Avvalgi to'g'ridan-to'g'ri
          # `git reset --hard` shu yerdagi commit qilinmagan o'zgarishlarni
          # sassiz yo'q qilardi. Endi reset'dan oldin ular stash'ga olinadi —
          # `git stash list` orqali tiklash mumkin.
          if ! git diff --quiet \
            || ! git diff --cached --quiet \
            || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              stash_nomi="deploy-autostash $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA:-manual}"
              echo "::warning::/opt/MCHS ichida commit qilinmagan o'zgarishlar topildi — yo'q qilinmaydi, stash'ga olinadi: ${stash_nomi}"
              git stash push --include-untracked -m "${stash_nomi}"
              echo "Tiklash uchun:  cd /opt/MCHS && git stash list && git stash apply stash@{0}"
              # `| head -5` bilan pipefail birga ishlatilsa: stash ro'yxati
              # 5 tadan ko'p bo'lganda head oldinroq yopiladi, git SIGPIPE
              # oladi va pipefail buni xatolik deb hisoblab butun qadamni
              # (demak, keyingi `reset --hard` ham) muvaffaqiyatsiz qiladi.
              # Bu shunchaki ma'lumot chiqarish, mantiqiy natijaga ta'sir
              # qilmasligi kerak — shuning uchun "|| true".
              git stash list | head -5 || true
          fi

          git reset --hard origin/main

      - name: Build & deploy (docker compose)
        run: |
          set -e
          cd /opt/MCHS
          docker compose -f docker-compose.prod.yml build backend
          docker compose -f docker-compose.prod.yml up -d postgres redis backend web-builder nginx
          # nginx caches the backend container's IP via Docker's embedded DNS
          # at startup (the "upstream" directive resolves once). Since backend
          # just got recreated with a new IP, nginx must be restarted or every
          # deploy after the first one 502s until someone notices.
          docker compose -f docker-compose.prod.yml restart nginx

      - name: Wait for backend health
        run: |
          set -e
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' xavfsiz-backend-prod 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker logs xavfsiz-backend-prod --tail 100
          exit 1

      - name: Prune old images
        run: docker image prune -f
