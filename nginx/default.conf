# ============================================================
# XAVFSIZ XONADON — Nginx production konfiguratsiyasi
# Reverse proxy: /api → backend, / → web static, /uploads → static
# ============================================================

# ---------- Rate limiting zones ----------
# NOTE: limit_req_zone faqat http kontekstida ishlaydi —
# shuning uchun server {} blokidan tashqarida bo'lishi shart.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ---------- HTTP -> HTTPS redirect ----------
    # Cloudflare Tunnel (asosiy prod yo'l) TLS'ni o'zi tugatadi va ichki
    # tarmoqda nginx ga oddiy HTTP orqali ulanadi — shu holatda
    # X-Forwarded-Proto headeri yuborilmaydi yoki "https" bo'ladi.
    # Redirect faqat aniq "http" proto bilan kelgan (tashqi, tunnel'siz)
    # so'rovlar uchun; header bo'lmasa redirect QILINMAYDI — aks holda
    # ichki tunnel trafigi va /health healthcheck uzilib qolardi.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ---------- HSTS ----------
    # Eslatma: bu header HTTP javoblarga ham qo'shiladi (nginx 80-port
    # serverida). Cloudflare Tunnel orqali tashqi foydalanuvchi har doim
    # HTTPS ko'radi, shu sabab amalda brauzer uni HTTPS javobda oladi;
    # to'g'ridan-to'g'ri TLS (443 server) yoqilsa ham o'z o'rnida ishlaydi.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- Uploads (static media) ----------
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ---------- API reverse proxy ----------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout (long exports)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support
        proxy_buffering off;

        # Rate limit
        limit_req zone=api burst=20 nodelay;
    }

    # ---------- Web dashboard (SPA) ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;

    # ---------- Huge uploads ----------
    client_max_body_size 20m;
    client_body_timeout 60s;

    # ---------- Deny hidden files ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- Health check ----------
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# NAMUNA: To'g'ridan-to'g'ri TLS (Cloudflare Tunnel'siz) kerak bo'lsa,
# quyidagi 443 server blokini faollashtiring va sertifikat fayllarini
# nginx konteyneriga mount qiling. Cloudflare Tunnel asosiy prod yo'li
# bo'lgani uchun bu blok default holatda comment qilingan.
